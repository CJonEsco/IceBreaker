[build]
  publish = "dist"
  command = "npm run build"

# Fallback for Single Page Application client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# High-Security Response Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self' https: data: blob: 'unsafe-inline' 'unsafe-eval'; img-src 'self' https: data: blob: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://images.unsplash.com; connect-src 'self' https: wss:; media-src 'self' blob: mediastream:; font-src 'self' https: data:;"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
